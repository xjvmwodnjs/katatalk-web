name: Staging Smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Staging base URL, including https://
        required: true
        type: string
      create_checkout:
        description: Create one staging checkout URL with the configured smoke account
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: staging-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Authenticated staging smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      SMOKE_BASE_URL: ${{ inputs.base_url }}
      SMOKE_AUTH_TOKEN: ${{ secrets.SMOKE_AUTH_TOKEN }}
      SMOKE_OPS_TOKEN: ${{ secrets.SMOKE_OPS_TOKEN }}
      SMOKE_CREATE_CHECKOUT: ${{ inputs.create_checkout }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Corepack
        run: corepack enable
      - name: Install locked dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Require the staging smoke account token
        shell: bash
        run: |
          if [ -z "${SMOKE_AUTH_TOKEN:-}" ]; then
            echo "Configure SMOKE_AUTH_TOKEN as a protected staging environment secret."
            exit 1
          fi
          if [ -z "${SMOKE_OPS_TOKEN:-}" ]; then
            echo "Configure SMOKE_OPS_TOKEN as a protected staging environment secret."
            exit 1
          fi
      - name: Run deploy smoke
        run: corepack pnpm deploy:smoke
