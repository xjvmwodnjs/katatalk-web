name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AUTH_PROVIDER: local-dev
  VITE_AUTH_PROVIDER: local-dev
  JWT_SECRET: ci-local-secret-not-for-production

jobs:
  quality:
    name: Type, unit, build, and secret checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Corepack
        run: corepack enable
      - name: Install locked dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Scan tracked files for committed secrets
        run: corepack pnpm ci:secrets
      - name: Check formatting
        run: corepack pnpm exec prettier --check .github/workflows/ci.yml .github/workflows/staging-smoke.yml .github/workflows/analysis-data-retention.yml package.json scripts/ci-secret-scan.ts scripts/db/*.mjs server/ciSecretScan.ts server/ciSecretScan.test.ts server/migrationRunner.test.ts docs/analysis-data-retention-runbook.md docs/database-migration-gate.md
      - name: Type check
        run: corepack pnpm check
      - name: Unit tests
        run: corepack pnpm test:ci
      - name: Production build
        run: corepack pnpm build

  database-migrations:
    name: PostgreSQL migrations, ACL, and atomicity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run fresh, upgrade, privilege, rollback, and concurrency gate
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
          KATATALK_DB_GATE_CONFIRM: ephemeral-postgres
          DB_GATE_ARTIFACT_DIR: ${{ runner.temp }}/database-gate
        run: node scripts/db/ci-gate.mjs
      - name: Upload database gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-migration-gate
          path: ${{ runner.temp }}/database-gate/
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Corepack
        run: corepack enable
      - name: Install locked dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Install Chromium
        run: corepack pnpm exec playwright install --with-deps chromium
      - name: Run E2E suite
        run: corepack pnpm e2e
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  dependency-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Corepack
        run: corepack enable
      - name: Install locked dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Fail on high or critical production dependency advisories
        run: corepack pnpm audit --prod --audit-level high
